<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
    <div class="container text-center bg-body">
        <div class="row justify-content-center align-items-center vh-100">
            <div class="col-md-5">
                <h1>Iniciar Sesion</h1>
                <form id="loginform">

                    <div class="mb-3">
                        <label for="mail" class="form-label">Correo electronico</label>
                        <input type="text" class="form-control text-center" id="mail" placeholder="Ingrese su correo electronico">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Contraseña
                        </label>
                        <input 
                            type="password"
                            id="password"
                            class="form-control text-center"
                            placeholder="Ingrese su Contraseña">
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100">
                        Iniciar Sesion
                    </button>
                    <div id="mensaje" class="text-center mt-3"></div>
                </form>
            </div>
            </div>
            <div class="imgBox row">
                <img src="assets/img/background01.jpg" alt="">
            </div>
        </div> 
    </div>

    <script src="script.js"></script>
</body>
</html>
</html>
